name: AidHero CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run test -- accessibility
      - name: Validate decision tree depths
        run: npx tsx src/lib/data/validateTreeDepth.ts
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: http://localhost:3000
          budgetPath: ./lighthouserc.json

  generate-audio:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    env:
      GOOGLE_CLOUD_TTS_API_KEY: ${{ secrets.GOOGLE_CLOUD_TTS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check for scenario changes
        id: check-scenarios
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q 'data/scenarios/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check-scenarios.outputs.changed == 'true'
        with: { node-version: '20' }
      - run: npm ci
        if: steps.check-scenarios.outputs.changed == 'true'
      - run: npm run generate:audio
        if: steps.check-scenarios.outputs.changed == 'true'
      - run: npm run generate:manifest
        if: steps.check-scenarios.outputs.changed == 'true'
      - name: Commit generated audio files
        if: steps.check-scenarios.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: regenerate TTS audio [skip ci]'
          file_pattern: 'public/audio/** data/content-manifest.json'

  deploy:
    runs-on: ubuntu-latest
    needs: [test, generate-audio]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
